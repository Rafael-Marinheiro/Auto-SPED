name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e ".[desktop,build]"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows application and installer
        shell: powershell
        run: .\scripts\build_windows.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Auto-SPED-Windows-portable
          path: dist/Auto-SPED/
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Auto-SPED-Windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
